# OceanEmbed model and training hyperparameters
model:
  encoder_type: "cnn"
  decoder_type: "mlp"
  latent_dim: 256

encoder:
  in_channels: 6
  hidden_channels: [32, 64, 128]
  patch_size: 4
  depths: [2, 2, 2]
  num_heads: 4
  mlp_dim: 512
  dropout: 0.1

 decoder:
  hidden_dim: 256
  num_depth_levels: 10
  depths_m: [0, 10, 20, 50, 100, 200, 500, 1000, 1500, 2000]
  output_dim: 1
  continuous: false
  dropout: 0.1

training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  num_epochs: 100
  early_stopping_patience: 10
  optimizer: "adam"
  loss_fn: "mse"

losses:
  smoothness_weight: 0.1
  monotonicity_weight: 0.1

data_loader:
  num_workers: 4
  pin_memory: true

runtime:
  device: "cuda"
  seed: 42
