# OceanEmbed model and training hyperparameters
model:
  name: "oceanembed_cnn_temporal"
  active_model: "cnn_temporal"
  encoder_type: "cnn"
  decoder_type: "mlp"
  latent_dim: 64

encoder:
  in_channels: 26
  hidden_channels: [16, 32, 64]
  patch_size: 12
  dropout: 0.2

decoder:
  hidden_dim: 64
  latent_dim: 68 # 64 latent + 4 positional/temporal features
  num_depth_levels: 10
  depths_m: [0, 10, 20, 50, 100, 200, 500, 1000, 1500, 2000]
  output_dim: 1
  continuous: true
  dropout: 0.1

training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  num_epochs: 100
  early_stopping_patience: 10
  optimizer: "adam"
  loss_fn: "mse"

losses:
  smoothness_weight: 0.1
  monotonicity_weight: 0.1

data_loader:
  num_workers: 4
  pin_memory: true

runtime:
  device: "cuda"
  seed: 42
